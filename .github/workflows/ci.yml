name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .

  test:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      - name: pytest
        run: uv run pytest -q --junit-xml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: pytest.xml

  renders:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      # A report that imports but does not render is the failure mode a unit
      # test misses: the template and the figures only meet at write time.
      - name: a report renders end to end
        run: uv run python -c "
          import matplotlib; matplotlib.use('Agg');
          from tests.conftest import sample_report;
          path = sample_report('/tmp/tearsheet.html');
          print(path)
          "
